<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DDIM 数字生成</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #15191e; color: #edf1f5; }
    body { margin: 0; }
    main { max-width: 45rem; margin: 0 auto; padding: clamp(1.25rem, 6vw, 4.5rem) 1.25rem; }
    h1 { font-size: clamp(1.75rem, 5vw, 2.75rem); margin: 0 0 1.5rem; }
    p { color: #b8c3cc; }
    fieldset { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 9rem), 1fr)); gap: .85rem; padding: 0; margin: 0; border: 0; }
    label { display: flex; min-width: 0; flex-direction: column; gap: .35rem; font-size: .9rem; }
    select, input { min-width: 0; background: #242a31; color: inherit; border: 1px solid #53616d; border-radius: .5rem; padding: .6rem .65rem; font: inherit; }
    select:disabled { opacity: .55; }
    .actions { display: flex; flex-wrap: wrap; gap: .65rem; grid-column: 1 / -1; }
    button { background: #a0e2cd; color: #13251f; font: inherit; font-weight: 650; border: 0; border-radius: .5rem; padding: .65rem 1rem; cursor: pointer; }
    button.secondary { background: #242a31; color: #edf1f5; border: 1px solid #53616d; }
    button:disabled { cursor: wait; opacity: .65; }
    progress { accent-color: #a0e2cd; width: 100%; height: .75rem; display: block; margin-top: 1rem; }
    .images { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 13rem), 1fr)); gap: 1rem; margin: 1.5rem 0; }
    figure { margin: 0; max-width: 22rem; }
    canvas { display: block; width: 100%; height: auto; background: #090b0d; border: 1px solid #374049; border-radius: .6rem; image-rendering: pixelated; }
    figcaption { margin: .55rem 0; font-size: .9rem; color: #c7d2da; }
    dl { display: flex; flex-wrap: wrap; gap: .9rem 2.5rem; }
    dt { font-size: .9rem; color: #b8c3cc; }
    dd { margin: .25rem 0 0; font-variant-numeric: tabular-nums; }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.26.0/dist/ort.webgpu.min.js"></script>
  <script type="module" src="./web/app.js"></script>
</head>
<body>
  <main>
    <h1>DDIM 数字生成</h1>
    <form id="generator">
      <fieldset id="controls" aria-label="生成参数" disabled>
        <label>生成模式
          <select id="mode">
            <option value="unconditional">随机生成（无条件）</option>
            <option value="conditional">指定数字</option>
          </select>
        </label>
        <label>目标数字
          <select id="digit" disabled>
            <option>0</option><option>1</option><option>2</option><option>3</option><option>4</option>
            <option>5</option><option>6</option><option selected>7</option><option>8</option><option>9</option>
          </select>
        </label>
        <label>采样步数
          <select id="steps">
            <option value="10">10 步</option><option value="20" selected>20 步</option>
            <option value="50">50 步</option><option value="200">200 步</option>
          </select>
        </label>
        <label>种子
          <input id="seed" type="number" min="0" max="4294967295" step="1" value="42" required>
        </label>
        <div class="actions">
          <button type="submit">生成</button>
          <button id="random-seed" class="secondary" type="button">随机种子</button>
        </div>
      </fieldset>
    </form>
    <progress id="progress" max="20" value="0" aria-label="采样进度"></progress>
    <p id="status" role="status">正在初始化页面</p>
    <div class="images">
      <figure><canvas id="browser-image" width="28" height="28" aria-label="浏览器生成的数字"></canvas><figcaption>浏览器 · WebGPU</figcaption></figure>
      <figure id="python-result" hidden><canvas id="python-image" width="28" height="28" aria-label="Python 参考数字"></canvas><figcaption>Python · PyTorch</figcaption></figure>
    </div>
    <section id="timings" hidden aria-label="运行耗时">
      <dl>
        <div><dt>模型首次加载</dt><dd id="load-time"></dd></div>
        <div><dt>本次采样耗时</dt><dd id="sample-time"></dd></div>
      </dl>
    </section>
    <button id="compare" class="secondary" type="button" disabled>运行固定样本对照</button>
    <section id="errors" hidden aria-label="最终张量比较">
      <dl>
        <div><dt>平均绝对误差</dt><dd id="mean-error"></dd></div>
        <div><dt>最大绝对误差</dt><dd id="max-error"></dd></div>
      </dl>
    </section>
  </main>
</body>
</html>
